<!-- 기수 고르기 (10/23 사용자: 8기, 9기 일정을 적어 두고 둘 중에 골라서 신청, 신청 안내 바로 아래에, 고를 때 스크롤 이동이나 화면 바뀜 없이). 등록부 pick 폼만 build-v2.sh 가 끼움.
     카드(#pick)는 성별 문항 바로 앞, 지금 폼 기수가 골라진 채(.on). 다른 기수를 누르면 그 자리에서 골라지고 숨은 칸 cohort_pick 에 그 기수가 담김 → 서버가 그 기수 줄로 접수(shared/forms.mjs pickTarget).
     지금 폼 기수면 칸을 비워 둠(빈 값은 제출, 임시 저장, 입력 시작 지표에 안 들어감). 고른 기수에 맞춰 화면의 진행 기간, 신청 마감, 'N기' 글자를 바꿔 씀(마감 안내 #closed 는 그대로).
     성비, 지역, 나이 표기는 넣지 않음(사용자). 시간 마감 카드는 숨기고 정원 마감 카드는 비활성화. 신청 가능한 다른 기수가 있으면 그 기수를 선택 -->
<style>
.pk{margin-top:26px}
.pk[hidden]{display:none}
.pk-t{margin:0 0 10px;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--hh-ink,#131A26)}
.pk-c{display:block;width:100%;margin-top:10px;padding:16px 16px 15px 18px;background:#fff;border:1.5px solid var(--hh-line,#E3E8EF);border-radius:18px;font:inherit;text-align:left;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;transition:transform .12s,border-color .12s,background .12s}
.pk-c[hidden]{display:none}
.pk-c:active{transform:scale(.985)}
.pk-c:disabled{cursor:default;background:#F3F5F8;border-color:#E3E8EF;color:#8892A1}
.pk-c:disabled .pk-no,.pk-c:disabled .pk-chip{color:#8892A1}
.pk-c:disabled .pk-badge{background:#E3E8EF;color:#687384}
.pk-c:focus-visible{outline:2px solid var(--hh-blue,#2F7BD6);outline-offset:2px}
.pk-c.on{border-color:var(--hh-blue,#2F7BD6);background:#F2F8FF}
.pk-top{display:flex;align-items:center;gap:10px}
.pk-k{flex:none;box-sizing:border-box;width:22px;height:22px;border:1.5px solid #C3CCD8;border-radius:50%;background:#fff}
.pk-c.on .pk-k{border:6.5px solid var(--hh-blue,#2F7BD6)}
.pk-no{font-size:26px;font-weight:900;line-height:1;letter-spacing:-.04em;color:var(--hh-ink,#131A26)}
.pk-badge{margin-left:auto;flex:none;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:-.01em;background:#E7F6EC;color:#1E7A45}
.pk-badge.soon{background:#FFEFE0;color:#C2560F}
.pk-badge.by-gender,.pk-c:disabled .pk-badge.by-gender{display:flex;align-items:center;gap:5px;padding:0;background:transparent}
.pk-gender{padding:5px 8px;border-radius:999px;background:#E7F6EC;color:#1E7A45;font-size:12px;line-height:1.4;white-space:nowrap}
.pk-gender.pk-gender-full{background:#F0F1F4;color:#747D8A}
.pk-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0 32px}
.pk-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.pk-chip.p{background:var(--hh-sky,#EEF5FD);color:#1F5FAE}
.pk-chip.d{background:#F3F5F8;color:var(--hh-ink2,#465061)}
.pk-c.on .pk-chip.p,.pk-c.on .pk-chip.d{background:#fff}
@media(max-width:359px){.pk-chips{margin-left:0}.pk-chip{font-size:13px;padding:6px 10px}.pk-gender{font-size:11px;padding:5px 7px}}
</style>
<script>
(function(){
 var box=document.getElementById('pick'); if(!box) return;
 var own=box.getAttribute('data-own'), inp=box.querySelector('input[name="cohort_pick"]');
 var cards=[].slice.call(box.querySelectorAll('.pk-c'));
 function card(c){ for(var i=0;i<cards.length;i++) if(cards[i].getAttribute('data-cohort')===c) return cards[i]; return null; }
 var me=card(own); if(!me||!inp) return;
 // 지금 폼 기수 글자(진행 기간, 신청 마감, 'N기')가 든 글자 조각을 원래 모양으로 기억해 두고, 고른 기수 값으로 바꿔 씀
 var keys=['data-period','data-dl','data-ps','data-ds'], texts=[];
 var walk=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:function(n){ return n.parentNode.closest('#pick,#closed,script,style,noscript')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; }});
 for(var n=walk.nextNode(); n; n=walk.nextNode()){ var v=n.nodeValue; if(v.indexOf(own+'기')>=0||keys.some(function(k){ return v.indexOf(me.getAttribute(k))>=0; })) texts.push([n,v]); }
 var cur=own;
 function select(c,byUser){
  var to=card(c); if(!to||to.disabled||to.hidden) return;
  cards.forEach(function(a){ var on=a===to; a.classList.toggle('on',on); a.setAttribute('aria-checked',on?'true':'false'); });
  inp.value=c===own?'':c;
  texts.forEach(function(x){ var v=x[1]; keys.forEach(function(k){ v=v.split(me.getAttribute(k)).join(to.getAttribute(k)); }); x[0].nodeValue=v.split(own+'기').join(c+'기'); });
  if(byUser&&c!==cur){ try{ if(window.mixpanel&&mixpanel.__loaded) mixpanel.track('cohort_pick',{from:cur,to:c,page_cohort:own}); }catch(e){} }
  var changed=cur!==c;cur=c;if(changed) document.dispatchEvent(new Event('hh-cohort-change'));
 }
 cards.forEach(function(a){ a.addEventListener('click',function(){ select(a.getAttribute('data-cohort'),true); }); });
 // 임시 저장 복원(폼 스크립트가 숨은 칸 값을 되살림) 뒤 화면을 그 값에 맞춤
 document.addEventListener('DOMContentLoaded',function(){ if(inp.value&&card(inp.value)) select(inp.value,false); });
 // 마감까지 남은 날 (한국 날짜, 사흘 안이면 주황). 시간 마감은 숨기고 정원 마감은 표시한 채 선택을 막음
 var off=0;
 function day(t){ return Math.floor((t+9*36e5)/864e5); }
 function paint(){
  var now=Date.now()+off, open=0;
  cards.forEach(function(a){
   var dl=Number(a.getAttribute('data-deadline')), b=a.querySelector('.pk-badge'), ok=now<dl;
   a.hidden=!ok; if(!ok) return; open++;
   var st=(window.hhCapacityStates||{})[a.getAttribute('data-path')],full=st&&st.open===false&&st.reason==='capacity';
   a.disabled=!!full;a.setAttribute('aria-disabled',full?'true':'false');
   var available=st&&(st.available||(st.open?{m:true,f:true}:null));
   if(available){
    b.classList.add('by-gender');b.classList.remove('soon');
    b.innerHTML=['m','f'].map(function(g){return '<span class="pk-gender'+(available[g]?'':' pk-gender-full')+'">'+(g==='m'?'남성':'여성')+' '+(available[g]?'모집 중':'마감')+'</span>'}).join(' ');
    return;
   }
   b.classList.remove('by-gender');
   if(full){b.textContent='정원 마감';b.classList.remove('soon');return;}
   var d=day(dl)-day(now); b.textContent=d<=0?'오늘 마감':'마감 D-'+d; b.classList.toggle('soon',d<=3);
  });
  var current=card(cur), selectable=cards.filter(function(a){return !a.hidden&&!a.disabled});
  var free=box.hasAttribute('data-free')&&selectable.length>1;   // 이야기판(data-free, 10/26 사용자: 기수를 직접 고르게): 고를 수 있는 기수가 둘 이상이면 미리 고르지 않음, 하나면 그 기수를 골라 둠
  if(current.hidden||current.disabled){var next=cards.filter(function(a){return !a.hidden&&!a.disabled})[0];if(next)select(next.getAttribute('data-cohort'),false);else cards.forEach(function(a){a.classList.remove('on');a.setAttribute('aria-checked','false')});}
  else if(!current.classList.contains('on')&&!free)select(cur,false);
  box.hidden=open<1;
 }
 paint();
 document.addEventListener('hh-capacity-change',paint);
 fetch('/api/cohort',{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(s){ if(s&&isFinite(s.serverNow)){ off=Number(s.serverNow)-Date.now(); paint(); } }).catch(function(){});
 setInterval(paint,30000);
})();
</script>
