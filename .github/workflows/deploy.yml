name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y zsh >/dev/null
      - run: ./build.sh
        env:
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 780130702a3ae99b9836209710a0ab6f
          command: pages deploy public --project-name haruharu-apply --branch main --commit-dirty=true
